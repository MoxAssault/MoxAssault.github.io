<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPXS Refactor Smoke Test</title>
  <style>
    body { margin: 0; padding: 20px; font: 14px system-ui, sans-serif; background: #111; color: #eee; }
    h1 { margin-top: 0; }
    iframe { width: 100%; height: 560px; border: 1px solid #555; border-radius: 8px; background: #fff; }
    #results { display: grid; gap: 6px; margin: 16px 0; padding: 0; list-style: none; }
    .pass { color: #4ade80; }
    .fail { color: #ff6473; }
    .pending { color: #ffd166; }
    code { color: #ff9dd5; }
  </style>
</head>
<body>
  <h1>VPXS Refactor Smoke Test</h1>
  <p>This page loads the refactor build and checks its critical browser-facing dependencies.</p>
  <ul id="results"><li class="pending">Waiting for the refactor application…</li></ul>
  <iframe id="appFrame" src="/refactor/" title="VPXS refactor application"></iframe>
  <script src="smoke-test.js"></script>
  <script src="stage9-smoke.js"></script>
</body>
</html>

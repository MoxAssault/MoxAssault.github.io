<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPXS Refactor Final Regression</title>
  <style>
    body { margin: 0; padding: 20px; font: 14px system-ui, sans-serif; background: #111; color: #eee; }
    h1 { margin-top: 0; }
    .frame-wrap { position: relative; min-height: 620px; }
    iframe { width: 100%; height: 620px; border: 1px solid #555; border-radius: 8px; background: #fff; }
    .frame-status {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      border: 1px solid #555;
      border-radius: 8px;
      background: #181818;
      color: #ffd166;
      font-weight: 700;
    }
    .frame-status[hidden] { display: none; }
    #results { display: grid; gap: 6px; margin: 16px 0 8px; padding: 0; list-style: none; }
    #checkCount { min-height: 1.4em; margin: 0 0 16px; color: #aaa; }
    .pass { color: #4ade80; }
    .fail { color: #ff6473; }
    .pending { color: #ffd166; }
    code { color: #ff9dd5; }
  </style>
</head>
<body>
  <h1>VPXS Refactor Final Regression</h1>
  <p>This page runs the complete regression gate against the native-module refactor build.</p>
  <ul id="results"><li class="pending">Waiting for the refactor application…</li></ul>
  <p id="checkCount" role="status" aria-live="polite">Expected suite size: 37 consolidated checks.</p>
  <div class="frame-wrap">
    <iframe class="is-testing" id="appFrame" src="/refactor/?v=20260717-cleanup-2" title="VPXS refactor application"></iframe>
    <div class="frame-status" id="frameStatus" role="status">Running isolated regression fixtures…</div>
  </div>
  <script>
    (() => {
      const EXPECTED_CHECKS = 37;
      const frame = document.getElementById('appFrame');
      const frameStatus = document.getElementById('frameStatus');
      const results = document.getElementById('results');
      const checkCount = document.getElementById('checkCount');
      let started = false;
      let finished = false;

      function revealCleanApplication() {
        const cleanUrl = `/refactor/?posttest=${Date.now()}`;
        frame.addEventListener('load', () => {
          frame.classList.remove('is-testing');
          frameStatus.hidden = true;
        }, { once: true });
        frame.src = cleanUrl;
      }

      function finishRegression() {
        if (finished) return;
        const summary = results.firstElementChild?.textContent || '';
        if (!/regression check/i.test(summary)) return;

        finished = true;
        resultObserver.disconnect();
        const completed = Math.max(0, results.children.length - 1);
        const expected = completed === EXPECTED_CHECKS;
        checkCount.textContent = expected
          ? `${completed} of ${EXPECTED_CHECKS} consolidated checks completed.`
          : `${completed} checks completed; ${EXPECTED_CHECKS} were expected.`;
        checkCount.className = expected ? 'pass' : 'fail';
        frameStatus.textContent = 'Restoring the clean application state…';
        revealCleanApplication();
      }

      const resultObserver = new MutationObserver(finishRegression);
      resultObserver.observe(results, { childList: true, subtree: true, characterData: true });

      function startRegression() {
        if (started) return;
        started = true;
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/refactor/tests/final-smoke.js?v=20260717-cleanup-2';
        document.body.appendChild(script);
      }

      function hasLoadedRefactor() {
        try {
          return frame.contentDocument?.readyState === 'complete'
            && frame.contentWindow?.location?.pathname === '/refactor/';
        } catch (_) {
          return false;
        }
      }

      if (hasLoadedRefactor()) startRegression();
      else frame.addEventListener('load', startRegression, { once: true });
    })();
  </script>
</body>
</html>

# Automatic checks on every push to main and every PR into it.
#
# The site is published by pages.yml, which runs only after this workflow
# succeeds for a push to main, so a red check now stops the deploy (since
# 2026-11-02; before that Pages published main directly and these checks
# could only report). Run `npm test` before pushing anyway.
#
# Deterministic tools only - no AI service is called from here.
# The judgment half of review (logic, performance, authorization) is the
# pr-checker subagent, run locally before a push.

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Dependency-free test runner: no npm install, no lockfile.
      - run: npm test

  secrets:
    name: leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The binary, not gitleaks-action, so no licence key or third-party
      # action is involved. The checksum is verified before it runs.
      - name: install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: scan full history
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  semgrep:
    name: security patterns (semgrep)
    runs-on: ubuntu-latest
    container:
      # Tag to read, digest to run: a tag can be moved to other code, a digest can't.
      image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # p/default, not p/typescript or p/nodejs: those two missed a planted
      # eval() and shell injection in testing on 2026-09-22.
      - run: semgrep scan --config p/default --metrics off --error .

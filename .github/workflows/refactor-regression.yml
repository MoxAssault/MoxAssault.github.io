name: Refactor Regression

on:
  workflow_dispatch:
  push:
    paths:
      - 'refactor/**'
      - '.github/workflows/refactor-regression.yml'

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vpxs-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/refactor/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vpxs-http.log
          exit 1

      - name: Run browser regression
        run: node refactor/tests/run-browser-regression.mjs
